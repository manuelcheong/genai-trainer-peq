[project]
name = "genai-trainer-peq"
version = "0.1.0"
description = "ADK Trainer PEQ demo application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Google LLC" }
]

dependencies = [
    "google-adk>=1.20.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
genai-trainer-peq = "genai_trainer_peq.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_trainer_peq"]

[tool.hatch.build.targets.wheel.shared-data]
"src/genai_trainer_peq/static" = "share/genai_trainer_peq/static"
"src/genai_trainer_peq/.env" = "share/genai_trainer_peq/.env.template"
