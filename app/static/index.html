<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAK Bidi-streaming Demo</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" type="module"></script>
</head>

<body>
  <header>
    <h1>MAK Bidi-streaming Demo</h1>
    <div class="subtitle">Real-time bidirectional streaming</div>
    <div class="header-options" hidden>
      <label class="header-checkbox"
        title="Enable model to proactively respond without explicit prompts (Native audio models only)">
        <input type="checkbox" id="enableProactivity" hidden disabled>
        <span hidden>Proactivity</span>
      </label>
      <label class="header-checkbox"
        title="Enable model to detect and adapt to emotional cues (Native audio models only)">
        <input type="checkbox" id="enableAffectiveDialog" hidden disabled>
        <span hidden>Affective Dialog</span>
      </label>
    </div>
    <div class="connection-status">
      <span class="status-indicator" id="statusIndicator"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <div class="main-layout">
    <div class="container">
      <div id="messages"></div>

      <div class="input-container">
        <form id="messageForm">
          <div class="input-wrapper">
            <input type="text" id="message" name="message" placeholder="Type your message here..." autocomplete="off" />
            <button type="submit" id="sendButton" disabled>Send</button>
            <button type="button" id="startAudioButton">Start Audio</button>
            <button type="button" id="cameraButton">📷 Camera</button>
          </div>
        </form>
      </div>
      <!-- Camera Panel -->
      <div id="cameraPanel" class="camera-panel">
        <div class="camera-panel-header">
          <h3>Camera Preview</h3>
          <button id="closeCameraPanel" class="close-btn">&times;</button>
        </div>
        <div class="camera-panel-content">
          <div class="camera-preview-container">
            <video id="cameraPreview" autoplay playsinline></video>
          </div>
          <div class="camera-panel-controls">
            <button id="captureImage" class="btn-primary">📷 Send Image</button>
            <button id="streamVideo" class="btn-primary">🎥 Start Video Stream</button>
          </div>
        </div>
      </div>
    </div>

    <div class="console-panel">
      <div class="console-header">
        <h2>Event Console</h2>
        <div class="console-controls">
          <label class="console-checkbox">
            <input type="checkbox" id="showAudioEvents">
            <span>Show audio</span>
          </label>
          <button id="clearConsole" class="console-clear-btn">Clear</button>
        </div>
      </div>
      <div id="consoleContent" class="console-content"></div>
    </div>
  </div>

</body>

</html>
